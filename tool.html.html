<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Toplane Strategie Tool - LeagueBois</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Basisstijl: Dark fantasy thema met goud accenten, aangepast van leaguebois.nl */
        body {
            background-color: #1a1a1a; /* Donker grijs/zwart */
            color: #e6e6e6; /* Lichte tekst */
            font-family: 'Cinzel', serif; /* Fantasy font */
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            border: 2px solid #d4af37; /* Goud rand */
            border-radius: 10px;
            background-color: #2c2c2c; /* Donkerder achtergrond */
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); /* Glowing goud effect */
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        h1 {
            color: #d4af37; /* Goud titel */
            text-shadow: 0 0 10px #d4af37; /* Glowing highlight */
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .section {
            flex: 1;
            padding: 20px;
            background-color: #3c3c3c;
            border: 1px solid #d4af37;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .section h2 {
            color: #d4af37;
            text-shadow: 0 0 5px #d4af37;
            margin-bottom: 15px;
        }

        input[type="text"] {
            display: block;
            margin: 0 auto 15px;
            padding: 10px;
            width: 100%;
            background-color: #3c3c3c;
            border: 1px solid #d4af37;
            color: #e6e6e6;
            border-radius: 5px;
            font-family: 'Cinzel', serif;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); /* Kleiner minmax voor icons */
            gap: 10px; /* Minder gap voor compactheid */
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .icon {
            cursor: pointer;
            text-align: center;
            padding: 5px; /* Minder padding */
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .icon img {
            width: 48px; /* Kleiner gemaakt */
            height: 48px; /* Kleiner gemaakt */
            border-radius: 50%;
            filter: drop-shadow(0 0 5px #d4af37);
            transition: transform 0.2s;
        }

        .icon:hover img {
            transform: scale(1.1);
        }

        .icon.selected {
            background-color: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 15px #d4af37;
        }

        .icon.selected img {
            border: 2px solid #d4af37;
            transform: scale(1.1);
        }

        .icon p {
            font-size: 11px; /* Iets kleiner font voor namen */
            color: #e6e6e6;
            margin-top: 3px;
        }

        button {
            background-color: #d4af37;
            color: #1a1a1a;
            border: none;
            padding: 15px 30px;
            margin: 20px auto;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Cinzel', serif;
            box-shadow: 0 0 10px #d4af37;
            transition: transform 0.2s;
            display: block;
            font-size: 1.2em;
        }

        button:hover {
            transform: scale(1.05);
        }

        #results {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            border: 2px solid #d4af37;
            border-radius: 10px;
            background-color: #2c2c2c;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        #results h2 {
            color: #d4af37;
            text-shadow: 0 0 10px #d4af37;
        }

        #results p {
            font-size: 18px;
            margin: 10px 0;
        }

        #results a {
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
        }

        #results a:hover {
            text-decoration: underline;
        }

        .abilities-section {
            margin-top: 30px;
        }

        .ability-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 30px;
            padding: 20px; /* Meer padding voor ruimte */
            background-color: #3c3c3c;
            border: 1px solid #d4af37;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            gap: 25px; /* Meer gap tussen video en tekst */
        }

        .ability-item video {
            width: 250px; /* Groter gemaakt */
            height: 250px; /* Groter gemaakt */
            border-radius: 10px;
            filter: drop-shadow(0 0 5px #d4af37);
            cursor: pointer;
            object-fit: cover;
            transition: transform 0.2s; /* Hover effect toevoegen */
        }

        .ability-item video:hover {
            transform: scale(1.05);
        }

        .ability-content {
            flex: 1;
            text-align: left;
        }

        .ability-content h3 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 1.4em;
        }

        .ability-content p {
            font-size: 16px;
            color: #e6e6e6;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .ability-item {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .ability-item video {
                width: 200px; /* Iets kleiner op mobiel */
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <h1>LoL Toplane Strategie Tool</h1>
    <div class="container">
        <div class="section" id="mySection">
            <h2>Mijn Champion</h2>
            <input type="text" id="mySearch" placeholder="Zoek champion..." oninput="filterIcons('my')">
            <div class="grid" id="myGrid"></div>
            <p id="mySelected">Geselecteerd: Geen</p>
        </div>
        <div class="section" id="enemySection">
            <h2>Tegenstander</h2>
            <input type="text" id="enemySearch" placeholder="Zoek champion..." oninput="filterIcons('enemy')">
            <div class="grid" id="enemyGrid"></div>
            <p id="enemySelected">Geselecteerd: Geen</p>
        </div>
    </div>
    <button onclick="showStrategy()">Toon Strategie</button>
    <div id="results"></div>

    <script>
        let champions = [];
        let version = '';
        let myChampId = '';
        let enemyChampId = '';

        // Lijst van kernwoorden om dik te drukken (bold)
        const keywords = ['slow', 'slows','slowing', 'knocking up', 'stuns', 'true damage', 'silences', 'stun', 'silence', 'knock up', 'knockup', 'knockups']; // Voeg meer toe als nodig

        // Functie om tekst te highlighten
        function highlightKeywords(text) {
            keywords.forEach(word => {
                const regex = new RegExp(`\\b(${word})\\b`, 'gi'); // Case-insensitive, whole word
                text = text.replace(regex, '<strong>$1</strong>');
            });
            return text;
        }

        // Haal version
        async function getVersion() {
            try {
                const response = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
                const data = await response.json();
                return data[0];
            } catch (error) {
                console.error('Error fetching version:', error);
                alert('Fout bij laden van data. Probeer later opnieuw.');
                return '';
            }
        }

        // Haal champions
        async function getChampions() {
            version = await getVersion();
            if (!version) return;
            try {
                const response = await fetch(`https://ddragon.leagueoflegends.com/cdn/${version}/data/en_US/champion.json`);
                const data = await response.json();
                champions = Object.values(data.data).sort((a, b) => a.name.localeCompare(b.name));
                populateGrids();
            } catch (error) {
                console.error('Error fetching champions:', error);
                alert('Fout bij laden van champions. Check je internet.');
            }
        }

        // Vul grids met icons
        function populateGrids() {
            const myGrid = document.getElementById('myGrid');
            const enemyGrid = document.getElementById('enemyGrid');
            myGrid.innerHTML = '';
            enemyGrid.innerHTML = '';
            champions.forEach(champ => {
                const icon = createIcon(champ);
                myGrid.appendChild(icon.cloneNode(true));
                enemyGrid.appendChild(icon);
            });
        }

        // Maak icon element
        function createIcon(champ) {
            const div = document.createElement('div');
            div.className = 'icon';
            div.dataset.id = champ.id;
            div.innerHTML = `<img src="https://ddragon.leagueoflegends.com/cdn/${version}/img/champion/${champ.id}.png" alt="${champ.name}">
                             <p>${champ.name}</p>`;
            return div;
        }

        // Filter icons op search
        function filterIcons(type) {
            const search = document.getElementById(`${type}Search`).value.toLowerCase();
            const grid = document.getElementById(`${type}Grid`);
            Array.from(grid.children).forEach(icon => {
                const name = icon.querySelector('p').textContent.toLowerCase();
                icon.style.display = name.includes(search) ? 'block' : 'none';
            });
        }

        // Event listeners voor clicks
        document.getElementById('myGrid').addEventListener('click', e => {
            const icon = e.target.closest('.icon');
            if (icon) selectChampion(icon, 'my');
        });
        document.getElementById('enemyGrid').addEventListener('click', e => {
            const icon = e.target.closest('.icon');
            if (icon) selectChampion(icon, 'enemy');
        });

        // Selecteer champion
        function selectChampion(icon, type) {
            const grid = document.getElementById(`${type}Grid`);
            const prevSelected = grid.querySelector('.selected');
            if (prevSelected) prevSelected.classList.remove('selected');
            icon.classList.add('selected');
            const id = icon.dataset.id;
            const name = icon.querySelector('p').textContent;
            if (type === 'my') {
                myChampId = id;
                document.getElementById('mySelected').textContent = `Geselecteerd: ${name}`;
            } else {
                enemyChampId = id;
                document.getElementById('enemySelected').textContent = `Geselecteerd: ${name}`;
            }
        }

        // Toon strategie
        async function showStrategy() {
            if (!myChampId || !enemyChampId) {
                alert('Selecteer beide champions.');
                return;
            }
            const myChamp = champions.find(c => c.id === myChampId);
            const enemyChamp = champions.find(c => c.id === enemyChampId);

            const mySlug = myChampId.toLowerCase();
            const enemySlug = enemyChampId.toLowerCase();
            const lolalyticsUrl = `https://lolalytics.com/lol/${mySlug}/vs/${enemySlug}/build/?lane=top&tier=platinum_plus`;

            const enemyDetails = await getChampionDetails(enemyChampId);

            const paddedId = enemyChamp.key.padStart(4, '0');
            const baseVideoUrl = `https://d28xe8vt774jo5.cloudfront.net/`;
            const videoPaths = {
                P: `champion-abilities/${paddedId}/ability_${paddedId}_P1.webm`,
                Q: `champion-abilities/${paddedId}/ability_${paddedId}_Q1.webm`,
                W: `champion-abilities/${paddedId}/ability_${paddedId}_W1.webm`,
                E: `champion-abilities/${paddedId}/ability_${paddedId}_E1.webm`,
                R: `champion-abilities/${paddedId}/ability_${paddedId}_R1.webm`
            };

            let html = `<h2>Strategie: ${myChamp.name} vs ${enemyChamp.name}</h2>`;
            html += `<p><strong>Builds met beste winrate (van LoLalytics):</strong> <a href="${lolalyticsUrl}" target="_blank">Bekijk matchup builds</a></p>`;
            html += `<p><strong>Officiële champion page:</strong> <a href="https://www.leagueoflegends.com/en-us/champions/${enemySlug}/" target="_blank">Bekijk op League site</a></p>`;
            html += `<div class="abilities-section"><h3>Abilities van ${enemyChamp.name}</h3>`;

            // Passive
            const passive = enemyDetails.passive;
            const passiveImg = `https://ddragon.leagueoflegends.com/cdn/${version}/img/passive/${passive.image.full}`;
            const passiveVideoSrc = baseVideoUrl + videoPaths.P;
            const passiveDesc = highlightKeywords(passive.description);
            html += `
                <div class="ability-item">
                    <video poster="${passiveImg}" src="${passiveVideoSrc}" muted loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
                    <div class="ability-content">
                        <h3>Passive: ${passive.name}</h3>
                        <p>${passiveDesc}</p>
                    </div>
                </div>`;

            // Spells (Q, W, E, R) verticaal
            const keys = ['Q', 'W', 'E', 'R'];
            enemyDetails.spells.forEach((spell, index) => {
                const spellKey = keys[index];
                const spellImg = `https://ddragon.leagueoflegends.com/cdn/${version}/img/spell/${spell.image.full}`;
                const spellVideoSrc = baseVideoUrl + videoPaths[spellKey];
                const spellDesc = highlightKeywords(spell.description);
                html += `
                    <div class="ability-item">
                        <video poster="${spellImg}" src="${spellVideoSrc}" muted loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
                        <div class="ability-content">
                            <h3>${spellKey}: ${spell.name}</h3>
                            <p>${spellDesc}</p>
                        </div>
                    </div>`;
            });
            html += `</div>`;

            document.getElementById('results').innerHTML = html;
        }

        // Haal detailed champion data
        async function getChampionDetails(champId) {
            try {
                const response = await fetch(`https://ddragon.leagueoflegends.com/cdn/${version}/data/en_US/champion/${champId}.json`);
                const data = await response.json();
                return data.data[champId];
            } catch (error) {
                console.error('Error fetching champion details:', error);
                alert('Fout bij laden van champion details.');
                return {};
            }
        }

        // Start: Laad champions bij page load
        getChampions();
    </script>
</body>
</html>
