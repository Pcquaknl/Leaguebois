<!-- Updated index.html with new nav link -->
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Role Randomizer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Optioneel: Google Fonts voor fantasy-stijl font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Nieuwe navigatiebalk -->
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Role Randomizer</a></li>
            <li><a href="tool.html">Toplane Tool</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <h1>League of Legends Role Randomizer</h1>
        
        <!-- Stap 1: Spelers invoeren -->
        <div id="player-input">
            <p>Voer 1 tot 5 spelersnamen in:</p>
            <input type="text" id="player1" placeholder="Speler 1">
            <input type="text" id="player2" placeholder="Speler 2">
            <input type="text" id="player3" placeholder="Speler 3">
            <input type="text" id="player4" placeholder="Speler 4">
            <input type="text" id="player5" placeholder="Speler 5">
            <p><input type="checkbox" id="enable-dj"> DIEJEE 🎚🎧🎹</p>
            <p><input type="checkbox" id="enable-support-reroll"> Support reroll</p>
            <button id="start-btn">Start</button>
        </div>
        
        <!-- Stap 2: Rollen rollen -->
        <div id="game" class="hidden">
            <div id="wheel-container">
                <div id="wheel" class="wheel">
                    <img id="wheel-icon" src="" alt="" class="wheel-icon"> <!-- Icon in het midden -->
                </div>
                <p id="current-player">Huidige speler: ...</p>
            </div>
            <div id="slotmachine-container" class="hidden">
                <div class="slotmachine">
                    <ul id="slotmachine-list"></ul>
                </div>
                <p id="dj-message">Shotjeeeeeeeeee</p>
            </div>
            <div id="results"></div>
            <button id="reset-btn" class="hidden">Opnieuw rollen</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
