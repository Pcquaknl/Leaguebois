<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKÉMON GBA • FireRed vs LeafGreen</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --gba-inner-width: 680px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Press Start 2P', system-ui;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            image-rendering: pixelated;
        }

        /* GBA FRAME - PIXEL PERFECT */
        .gba-frame {
            width: 820px;
            max-width: 94vw;
            background: linear-gradient(#2f2f2f, #1a1a1a);
            border: 28px solid #111;
            border-radius: 38px 38px 82px 38px;
            box-shadow: 0 0 0 18px #222, 0 0 0 26px #0a0a0a, 0 50px 100px rgba(0,0,0,0.95),
                        inset 0 0 100px rgba(255,255,255,0.06);
            position: relative;
            padding: 22px 22px 82px 22px;
        }

        .gba-frame::before {
            content: "GAME BOY ADVANCE";
            position: absolute;
            top: -22px; left: 50%;
            transform: translateX(-50%);
            background: #111; color: #777;
            font-size: 11px; padding: 4px 30px;
            border-radius: 13px; letter-spacing: 3px; z-index: 100;
        }

        .screen-bezel {
            background: #000;
            border: 15px solid #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            height: 520px;
            box-shadow: inset 0 0 90px rgba(0,0,0,0.95);
        }

        .flash-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            pointer-events:none; z-index:999; background:#fff; opacity:0; transition:opacity 80ms linear;
        }

        /* ALLE SCREENS - STRIKTE CONTAINER */
        .screen {
            position: absolute; top:0; left:0; width:100%; height:100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            background: #0b1f0b; transition: opacity 800ms ease; overflow: hidden;
            padding: 20px 30px;
        }
        .screen.active { display: flex; }

        button {
            font-family: 'Press Start 2P', system-ui;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.1s; white-space: nowrap;
        }
        button:active { transform: translateY(6px); }

        /* INTRO */
        #intro-screen { background: linear-gradient(180deg, #1a0033 0%, #002200 100%); }
        .intro-title { font-size: 54px; color: #ffcc00; line-height: 0.85; animation: title-pulse 1.6s infinite alternate; }
        .intro-subtitle { font-size: 20px; color: #fff; margin: 10px 0 46px; }
        #start-btn {
            background: #cc0000; border: 10px solid #ffcc00;
            font-size: 25px; padding: 18px 68px; box-shadow: 0 12px 0 #990000;
        }
        @keyframes title-pulse { from { text-shadow: 0 0 30px #ffcc00; } to { text-shadow: 0 0 70px #ffcc00, 0 0 110px #ff6600; } }

        /* SETUP */
        .trainers-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 36px;
            width: 100%;
            max-width: var(--gba-inner-width);
            margin: 12px 0 34px;
        }
        .trainer-panel {
            background: rgba(255,255,255,0.09);
            border: 12px solid #ccc;
            padding: 18px 14px;
            text-align: center;
            box-shadow: 0 0 0 8px #000;
        }
        .trainer-panel h2 { font-size: 17px; margin-bottom: 14px; color: #ffcc00; }
        .photo-frame {
            width: 162px; height: 162px;
            margin: 0 auto 16px;
            border: 10px solid #fff; background: #111; overflow: hidden;
        }
        .photo-frame img { width:100%; height:100%; object-fit:cover; image-rendering:pixelated; }
        .upload-btn {
            display:block; width:100%; background:#222; border:6px solid #fff;
            padding:11px; font-size:13px; margin-bottom:11px;
        }
        input[type="text"] {
            width:100%; background:#000; border:6px solid #fff;
            color:#fff; padding:12px; font-size:16px; text-align:center;
        }
        #begin-battle {
            background:linear-gradient(#cc0000,#990000); border:10px solid #ffcc00;
            font-size:23px; padding:18px 70px; box-shadow:0 13px 0 #660000;
        }

        /* BATTLE */
        #battle-screen { background: radial-gradient(circle at 50% 32%, #330000 0%, #001a00 80%); }
        .battle-arena {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            width: 100%;
            max-width: 640px;
            height: 238px;
            position: relative;
            margin: 8px auto 0;
        }
        .trainer-side {
            text-align: center;
            transition: all 1.5s cubic-bezier(0.23,1,0.32,1);
            opacity: 0; transform: translateY(70px);
        }
        .trainer-side.show { opacity:1; transform:translateY(0); }
        .trainer-side img {
            width: 126px; height: 126px;
            border: 8px solid #fff; box-shadow:0 0 0 10px #000; image-rendering:pixelated;
        }
        .trainer-side p {
            margin-top: 10px; font-size: 16px; color:#ffcc00;
            max-width: 140px; margin-left:auto; margin-right:auto;
        }

        #vs-text {
            font-size: 96px; color:#ffcc00; z-index:20;
            text-shadow:0 0 30px #ff0000, 0 0 70px #00ff00;
            animation: vs-explode 1s ease forwards; opacity:0;
        }
        @keyframes vs-explode {
            0% { transform:scale(0.05) rotate(-80deg); opacity:0; }
            60% { transform:scale(1.4) rotate(25deg); }
            100% { transform:scale(1) rotate(0); opacity:1; }
        }

        .pokeball-container {
            position: absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:40;
        }
        .pokeball {
            width: 128px; height: 128px;
            background: radial-gradient(circle at 50% 28%, #fff 16%, #ee1515 17%, #ee1515 52%, #222 53%, #222 74%, #fff 75%);
            border: 16px solid #222; border-radius:50%;
            box-shadow: 0 20px 0 #000,
                        inset 0 -26px 40px rgba(0,0,0,0.65),
                        inset 0 26px 40px rgba(255,255,255,0.45);
        }
        .pokeball::before { content:''; position:absolute; top:50%; left:0; right:0; height:16px; background:#222; transform:translateY(-50%); }
        .pokeball::after {
            content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            width:44px; height:44px; background:#fff; border:9px solid #222; border-radius:50%;
        }
        .pokeball.spin { animation:spin 480ms linear infinite; }
        .pokeball.shake { animation:ultraShake 0.42s linear 7; }
        @keyframes spin { to { transform:rotate(360deg); } }
        @keyframes ultraShake {
            0%,100% { transform:translateX(0); }
            20% { transform:translateX(-22px); }
            40% { transform:translateX(22px); }
            60% { transform:translateX(-16px); }
            80% { transform:translateX(16px); }
        }

        .attack {
            position:absolute; font-size:44px; z-index:35; pointer-events:none;
            animation-duration:1.05s; animation-timing-function:linear; animation-fill-mode:forwards;
        }
        @keyframes flyRight { 0% { left:12%; opacity:1; transform:scale(1) rotate(0deg); } 100% { left:88%; opacity:0; transform:scale(0.1) rotate(1440deg); } }
        @keyframes flyLeft  { 0% { left:88%; opacity:1; transform:scale(1) rotate(0deg); } 100% { left:12%; opacity:0; transform:scale(0.1) rotate(-1440deg); } }
        .fire-attack { animation-name:flyRight; color:#ff4d4d; text-shadow:0 0 18px #ff8800; }
        .leaf-attack { animation-name:flyLeft;  color:#2ecc71; text-shadow:0 0 18px #00ff88; }

        #choosing-text {
            margin-top: 18px;
            font-size: 22px;
            color: #ffcc00;
            min-height: 32px;
            text-align: center;
            max-width: 580px;
            text-shadow: 0 0 20px #fff;
        }

        /* RESULT */
        #result-screen { background:#000; }
        .results-flex { display:flex; width:100%; height:100%; }
        .result-panel {
            flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
            position:relative; overflow:hidden;
        }
        .result-panel.fire { background:linear-gradient(135deg, #4a0000, #662200); }
        .result-panel.leaf { background:linear-gradient(135deg, #003300, #004d1a); }
        .result-panel img {
            width: 198px; height: 198px;
            border: 14px solid #fff; box-shadow:0 0 0 20px #000;
            image-rendering:pixelated; animation:bob 2.2s infinite ease-in-out;
        }
        .result-name { font-size: 25px; margin:22px 0 12px; color:#ffcc00; }
        .version-label {
            font-size: 29px;
            padding: 12px 48px;
            border: 9px solid;
            background:rgba(0,0,0,0.75);
            box-shadow:0 11px 0 #000;
        }
        .fire .version-label { border-color:#ff6600; color:#ffcc00; }
        .leaf .version-label { border-color:#2ecc71; color:#ccffcc; }

        .particles { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index:5; }
        .particle {
            position:absolute; font-size:32px; animation:particle-rise linear forwards; user-select:none;
        }
        @keyframes particle-rise {
            0% { transform:translateY(120px) rotate(0deg); opacity:1; }
            100% { transform:translateY(-620px) rotate(1800deg); opacity:0; }
        }

        /* UI */
        #sound-toggle { position:absolute; top:24px; right:28px; font-size:40px; cursor:pointer; z-index:1000; }
        #restart-btn {
            position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
            background:#222; border:6px solid #666; padding:13px 42px; font-size:15px; z-index:1000;
        }

        @media (max-width: 860px) {
            .gba-frame { width: 740px; padding: 18px 18px 70px 18px; }
            .screen-bezel { height: 475px; }
            .intro-title { font-size: 48px; }
            .trainers-container { gap: 26px; }
            .photo-frame { width: 148px; height: 148px; }
            #vs-text { font-size: 86px; }
            .result-panel img { width: 178px; height: 178px; }
        }
    </style>
</head>
<body>

    <div class="gba-frame" id="gba-frame">
        <div class="screen-bezel">
            <div class="flash-overlay" id="flash-overlay"></div>

            <!-- INTRO -->
            <div id="intro-screen" class="screen active">
                <div style="text-align:center; width:100%; max-width:620px;">
                    <div class="intro-title">POKÉMON</div>
                    <div style="font-size:21px;color:#ffcc00;margin:8px 0 6px;">VERSION SELECTOR</div>
                    <div style="font-size:18px;color:#fff;margin-bottom:48px;">FireRed <span style="color:#ff6600;">VS</span> LeafGreen</div>
                    <button id="start-btn">START</button>
                </div>
                <div id="intro-particles" class="particles"></div>
            </div>

            <!-- SETUP -->
            <div id="setup-screen" class="screen">
                <div class="trainers-container">
                    <div class="trainer-panel">
                        <h2>TRAINER 1</h2>
                        <div class="photo-frame"><img id="t1-preview" src="https://archives.bulbagarden.net/media/upload/thumb/8/8a/Red_FRLG.png/300px-Red_FRLG.png" alt=""></div>
                        <label class="upload-btn" for="file1">📸 UPLOAD FOTO</label>
                        <input type="file" id="file1" accept="image/*" style="display:none;">
                        <input type="text" id="name1" value="Trainer 1" placeholder="NAAM">
                    </div>
                    <div class="trainer-panel">
                        <h2>TRAINER 2</h2>
                        <div class="photo-frame"><img id="t2-preview" src="https://archives.bulbagarden.net/media/upload/thumb/4/4f/Leaf_FRLG.png/300px-Leaf_FRLG.png" alt=""></div>
                        <label class="upload-btn" for="file2">📸 UPLOAD FOTO</label>
                        <input type="file" id="file2" accept="image/*" style="display:none;">
                        <input type="text" id="name2" value="Trainer 2" placeholder="NAAM">
                    </div>
                </div>
                <button id="begin-battle">BEGIN BATTLE</button>
            </div>

            <!-- BATTLE -->
            <div id="battle-screen" class="screen">
                <div class="battle-arena" id="arena">
                    <div class="trainer-side" id="battle-left">
                        <img id="battle-img1" src="https://archives.bulbagarden.net/media/upload/thumb/8/8a/Red_FRLG.png/300px-Red_FRLG.png" alt="">
                        <p id="battle-name1">Trainer 1</p>
                    </div>

                    <div id="vs-text">VS</div>

                    <div class="trainer-side" id="battle-right">
                        <img id="battle-img2" src="https://archives.bulbagarden.net/media/upload/thumb/4/4f/Leaf_FRLG.png/300px-Leaf_FRLG.png" alt="">
                        <p id="battle-name2">Trainer 2</p>
                    </div>

                    <div class="pokeball-container">
                        <div id="pokeball" class="pokeball"></div>
                    </div>
                </div>
                <div id="choosing-text"></div>
                <div id="battle-particles" class="particles"></div>
            </div>

            <!-- RESULT -->
            <div id="result-screen" class="screen">
                <div class="results-flex">
                    <div class="result-panel fire" id="result-left">
                        <div class="particles" id="fire-particles"></div>
                        <img id="res-img1" src="" alt="">
                        <div class="result-name" id="res-name1"></div>
                        <div class="version-label">🔥 FIRE RED</div>
                    </div>
                    <div class="result-panel leaf" id="result-right">
                        <div class="particles" id="leaf-particles"></div>
                        <img id="res-img2" src="" alt="">
                        <div class="result-name" id="res-name2"></div>
                        <div class="version-label">🍃 LEAF GREEN</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="sound-toggle">🔊</div>
    <button id="restart-btn">RESTART GAME</button>

    <script>
        // === VOLLEDIG HERZIENDE VERSIE - GEEN OVERLAP MEER ===
        let soundEnabled = true;
        let trainer1 = { name: "Trainer 1", img: "https://archives.bulbagarden.net/media/upload/thumb/8/8a/Red_FRLG.png/300px-Red_FRLG.png" };
        let trainer2 = { name: "Trainer 2", img: "https://archives.bulbagarden.net/media/upload/thumb/4/4f/Leaf_FRLG.png/300px-Leaf_FRLG.png" };

        const screens = {
            intro: document.getElementById('intro-screen'),
            setup: document.getElementById('setup-screen'),
            battle: document.getElementById('battle-screen'),
            result: document.getElementById('result-screen')
        };

        let attackInterval = null;

        function initAudio() {
            if (!window.audioCtx) window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        function playTone(freq, dur, type='square', vol=0.6) {
            if (!soundEnabled || !window.audioCtx) return;
            const o = window.audioCtx.createOscillator();
            const g = window.audioCtx.createGain();
            o.type = type; o.frequency.value = freq; g.gain.value = vol;
            o.connect(g).connect(window.audioCtx.destination);
            o.start(); o.stop(window.audioCtx.currentTime + dur);
        }
        function playClick() { initAudio(); playTone(920,0.04); setTimeout(()=>playTone(1380,0.09),25); }
        function playBattleStart() { initAudio(); playTone(240,0.6,'sawtooth',0.7); setTimeout(()=>playTone(680,0.9,'sawtooth'),140); }
        function playReveal() { initAudio(); playTone(980,0.12); setTimeout(()=>playTone(1680,0.12),90); setTimeout(()=>playTone(2480,1.1,'sine',0.8),240); }

        function screenFlash() {
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '0.65';
            setTimeout(() => flash.style.opacity = '0', 90);
        }

        function createParticle(containerId, emoji, hue, count=1) {
            const cont = document.getElementById(containerId);
            for(let i=0; i<count; i++){
                const p = document.createElement('div');
                p.className = 'particle';
                p.textContent = emoji;
                p.style.left = Math.random()*100 + '%';
                p.style.bottom = '-30px';
                p.style.color = `hsl(${hue},100%,75%)`;
                p.style.fontSize = (28 + Math.random()*22) + 'px';
                p.style.animationDuration = (2.4 + Math.random()*2.8) + 's';
                cont.appendChild(p);
                setTimeout(()=>p.remove(), 8500);
            }
        }

        function launchAttack() {
            const arena = document.getElementById('arena');
            const att = document.createElement('div');
            att.className = `attack ${Math.random() > 0.5 ? 'fire-attack' : 'leaf-attack'}`;
            att.textContent = Math.random() > 0.5 ? '🔥' : '🍃';
            att.style.top = (26 + Math.random()*50) + '%';
            arena.appendChild(att);
            setTimeout(() => att.remove(), 1250);
        }

        function megaBurst(count) {
            for(let i = 0; i < count; i++) setTimeout(launchAttack, i * 26);
        }

        function screenShake() {
            const frame = document.getElementById('gba-frame');
            frame.style.transition = 'transform 60ms';
            frame.style.transform = 'translate(3px,3px)';
            setTimeout(() => frame.style.transform = 'translate(-3px,-3px)', 60);
            setTimeout(() => frame.style.transform = 'translate(0,0)', 150);
        }

        function startIntroSparkles() {
            setInterval(() => {
                if (screens.intro.classList.contains('active')) createParticle('intro-particles','✨',48,6);
            }, 280);
        }

        function showScreen(name) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[name].classList.add('active');
        }

        function startBattleSequence() {
            playBattleStart();
            const left = document.getElementById('battle-left');
            const right = document.getElementById('battle-right');
            const vs = document.getElementById('vs-text');
            const poke = document.getElementById('pokeball');
            const choosing = document.getElementById('choosing-text');

            left.classList.remove('show'); right.classList.remove('show');
            vs.style.opacity = 0; poke.classList.remove('spin','shake');
            choosing.textContent = '';

            document.getElementById('battle-img1').src = trainer1.img;
            document.getElementById('battle-name1').textContent = trainer1.name;
            document.getElementById('battle-img2').src = trainer2.img;
            document.getElementById('battle-name2').textContent = trainer2.name;

            showScreen('battle');

            setTimeout(() => { left.classList.add('show'); screenShake(); }, 180);
            setTimeout(() => { right.classList.add('show'); screenShake(); }, 680);

            setTimeout(() => { vs.style.opacity = 1; screenFlash(); screenShake(); }, 1350);

            setTimeout(() => {
                poke.style.transition = 'all 0.55s';
                poke.style.transform = 'translate(-50%,-150%) scale(0.15)';
                poke.style.opacity = '0';
                setTimeout(() => {
                    poke.style.transition = 'all 0.65s cubic-bezier(0.68,-0.55,0.27,1.55)';
                    poke.style.transform = 'translate(-50%,-50%) scale(1)';
                    poke.style.opacity = '1';
                    poke.classList.add('spin');
                }, 140);
            }, 2150);

            setTimeout(() => { attackInterval = setInterval(launchAttack, 125); }, 2550);

            setTimeout(() => {
                poke.classList.remove('spin');
                poke.classList.add('shake');
                screenShake(); screenFlash();
                megaBurst(28);
            }, 4150);

            setTimeout(() => {
                clearInterval(attackInterval);
                attackInterval = setInterval(() => { launchAttack(); if(Math.random()>0.65) screenFlash(); }, 72);

                let i = 0; const txt = "CHOOSING VERSIONS...";
                choosing.textContent = '';
                const type = setInterval(() => {
                    choosing.textContent += txt[i++];
                    if (i >= txt.length) {
                        clearInterval(type);
                        setTimeout(decideWinner, 850);
                    }
                }, 52);
            }, 5450);
        }

        function decideWinner() {
            clearInterval(attackInterval);
            playReveal();
            screenShake(); screenFlash();

            const trainer1GetsFire = Math.random() < 0.5;

            document.getElementById('res-img1').src = trainer1.img;
            document.getElementById('res-name1').textContent = trainer1.name;
            document.getElementById('res-img2').src = trainer2.img;
            document.getElementById('res-name2').textContent = trainer2.name;

            const leftPanel = document.getElementById('result-left');
            const rightPanel = document.getElementById('result-right');

            if (trainer1GetsFire) {
                leftPanel.classList.add('fire'); rightPanel.classList.add('leaf');
            } else {
                leftPanel.classList.add('leaf'); rightPanel.classList.add('fire');
                document.querySelector('#result-left .version-label').textContent = '🍃 LEAF GREEN';
                document.querySelector('#result-right .version-label').textContent = '🔥 FIRE RED';
            }

            showScreen('result');

            setTimeout(() => {
                createParticle('fire-particles','🔥',18,110);
                createParticle('leaf-particles','🍃',120,110);
            }, 350);
        }

        function init() {
            startIntroSparkles();

            document.getElementById('file1').addEventListener('change', e => {
                if (e.target.files[0]) {
                    const r = new FileReader();
                    r.onload = ev => { trainer1.img = ev.target.result; document.getElementById('t1-preview').src = ev.target.result; };
                    r.readAsDataURL(e.target.files[0]);
                }
            });
            document.getElementById('file2').addEventListener('change', e => {
                if (e.target.files[0]) {
                    const r = new FileReader();
                    r.onload = ev => { trainer2.img = ev.target.result; document.getElementById('t2-preview').src = ev.target.result; };
                    r.readAsDataURL(e.target.files[0]);
                }
            });

            document.getElementById('name1').addEventListener('input', e => trainer1.name = e.target.value || "Trainer 1");
            document.getElementById('name2').addEventListener('input', e => trainer2.name = e.target.value || "Trainer 2");

            document.getElementById('start-btn').addEventListener('click', () => { playClick(); showScreen('setup'); });
            document.getElementById('begin-battle').addEventListener('click', () => {
                playClick();
                trainer1.name = document.getElementById('name1').value || "Trainer 1";
                trainer2.name = document.getElementById('name2').value || "Trainer 2";
                startBattleSequence();
            });
            document.getElementById('restart-btn').addEventListener('click', () => { playClick(); location.reload(); });

            document.getElementById('sound-toggle').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
                playClick();
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    if (screens.intro.classList.contains('active')) document.getElementById('start-btn').click();
                    else if (screens.setup.classList.contains('active')) document.getElementById('begin-battle').click();
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
