        <p class="deck-result-note"><strong>Let op:</strong> dit controleert de kaartlegaliteit en restricted-kaarten. Deckgrootte, maximaal vier exemplaren, commander-kleuridentiteit, sideboardregels en andere deckbouwregels worden nog niet beoordeeld.</p>`;
    }

    async function checkDeck() {
      const parsed = parseDeckList(elements.deckList.value);
      const formatSlug = elements.deckFormat.value;
      elements.deckChecker.open = true;

      if (!parsed.entries.length) {
        elements.deckResult.hidden = false;
        elements.deckResult.innerHTML = `<p class="card-result-error"><strong>Geen kaarten gevonden.</strong><br>Plak een decklijst met bijvoorbeeld “4 Lightning Bolt”.</p>`;
        elements.deckList.focus();
        return;
      }
      if (parsed.unique > SITE_CONFIG.deckMaxUniqueCards) {
        elements.deckResult.hidden = false;
        elements.deckResult.innerHTML = `<p class="card-result-error"><strong>Deze lijst is te groot.</strong><br>Gebruik maximaal ${SITE_CONFIG.deckMaxUniqueCards} unieke kaartnamen per controle.</p>`;
        return;
      }
      if (!FORMAT_DATA[formatSlug]) return;

      state.deckCheckController?.abort();
      const controller = new AbortController();
      state.deckCheckController = controller;
      elements.deckSubmit.disabled = true;
      elements.deckSubmit.textContent = "Controleren…";
      elements.deckResult.hidden = false;
      elements.deckResult.setAttribute("aria-busy", "true");
      elements.deckResult.innerHTML = `<p class="card-result-meta">${parsed.unique} unieke kaartnamen worden gecontroleerd in ${escapeHtml(FORMAT_DATA[formatSlug].name)}…</p>`;

      try {
        const collection = await fetchDeckCollection(parsed.entries, controller.signal, (current, total) => {
          elements.deckSubmit.textContent = total > 1 ? `Controleren ${current}/${total}…` : "Controleren…";
        });
        if (controller.signal.aborted) return;
        renderDeckResult(parsed, collection.cards, formatSlug);
      } catch (error) {
        if (error.name === "AbortError") return;
        elements.deckResult.innerHTML = `<p class="card-result-error"><strong>Deckcontrole niet gelukt.</strong><br>${escapeHtml(error.message || "Scryfall is tijdelijk niet bereikbaar. Probeer het opnieuw.")}</p>`;
      } finally {
        if (state.deckCheckController === controller) {
          state.deckCheckController = null;
          elements.deckSubmit.disabled = false;
          elements.deckSubmit.textContent = "Controleer deck";
          elements.deckResult.removeAttribute("aria-busy");
        }
      }
    }

    async function loadDeckFile(file) {
      if (!file) return;
      if (file.size > SITE_CONFIG.deckFileMaxBytes) throw new Error("Het bestand is groter dan 1 MB.");
      state.deckCheckController?.abort();
      const text = await file.text();
      elements.deckList.value = text;
      elements.deckResult.hidden = true;
      updateDeckCount();
      showToast(`${file.name} geladen`);
    }

    async function copyCurrentLink() {
      const url = location.href;
      try {
        await navigator.clipboard.writeText(url);
        showToast("Link gekopieerd");
      } catch {
        const input = document.createElement("textarea");
        input.value = url;
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
        showToast("Link gekopieerd");
      }
    }

    function readCache(allowExpired = false) {
      try {
        const raw = localStorage.getItem(SITE_CONFIG.cacheKey);
        if (!raw) return null;
        const cached = JSON.parse(raw);
        const age = Date.now() - cached.savedAt;
        const hasLegality = cached.legality && Array.isArray(cached.legality.standard) && Array.isArray(cached.legality.alchemy);
        if (!Array.isArray(cached.data) || !hasLegality) return null;
        const isFresh = age <= SITE_CONFIG.cacheHours * 60 * 60 * 1000;
        if (!allowExpired && !isFresh) return null;
        return { ...cached, isFresh };
      } catch { return null; }
    }

    function writeCache(data, legality) {
      const savedAt = Date.now();
      try { localStorage.setItem(SITE_CONFIG.cacheKey, JSON.stringify({ savedAt, data, legality })); } catch { /* Opslag kan geblokkeerd zijn. */ }
      return savedAt;
    }

    function setUpdatedLabel() {
      if (state.liveStatus === "loading") {
        elements.updatedLabel.textContent = "Live legaliteit wordt gecontroleerd…";
        return;
      }
      if (state.liveStatus === "live" || state.liveStatus === "cache") {
        const date = state.lastSync ? dateFormatter.format(new Date(state.lastSync)) : formatDate(todayIso());
        elements.updatedLabel.textContent = `Live data · bijgewerkt op ${date}`;
        return;
      }
      if (state.liveStatus === "stale") {
        const date = state.lastSync ? dateFormatter.format(new Date(state.lastSync)) : formatDate(SITE_CONFIG.fallbackUpdated);
        elements.updatedLabel.textContent = `Cache · laatst bijgewerkt op ${date}`;
        return;
      }
      elements.updatedLabel.textContent = `Offline snapshot · ${formatDate(SITE_CONFIG.fallbackUpdated)}`;
    }

    function delay(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    async function fetchJsonWithRetry(url, retries = 1) {
      let lastError;
      for (let attempt = 0; attempt <= retries; attempt += 1) {
        try {
          const response = await fetch(url, { headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return await response.json();
        } catch (error) {
          lastError = error;
          if (attempt < retries) await delay(250 * (attempt + 1));
        }
      }
      throw lastError;
    }

    async function fetchAllCardsForSet(setCode) {
      const firstUrl = new URL(SITE_CONFIG.cardsSearchEndpoint);
      firstUrl.searchParams.set("q", `e:${setCode}`);
      firstUrl.searchParams.set("unique", "cards");
      let nextUrl = firstUrl.toString();
      const cards = [];
      let pages = 0;

      while (nextUrl && pages < 6) {
        const payload = await fetchJsonWithRetry(nextUrl, 1);
        if (!Array.isArray(payload.data)) throw new Error("Ongeldige kaartrespons");
        cards.push(...payload.data);
        pages += 1;
        nextUrl = payload.has_more && payload.next_page ? payload.next_page : null;
        await delay(SITE_CONFIG.probeDelayMs);
      }
      if (!cards.length) throw new Error("Geen kaarten gevonden");
      return cards;
    }

    function detectLegalChanges(nextLegality) {
      try {
        const previousRaw = localStorage.getItem("mtg-legality-last-live-codes");
        const previous = previousRaw ? JSON.parse(previousRaw) : null;
        if (previous) {
          const added = [];
          const removed = [];
          ["standard","alchemy"].forEach(key => {
            (nextLegality[key] || []).filter(code => !(previous[key] || []).includes(code)).forEach(code => added.push(`${code.toUpperCase()} (${FORMAT_DATA[key].name})`));
            (previous[key] || []).filter(code => !(nextLegality[key] || []).includes(code)).forEach(code => removed.push(`${code.toUpperCase()} (${FORMAT_DATA[key].name})`));
          });
          const parts = [];
          if (added.length) parts.push(`${added.length} nieuwe set${added.length === 1 ? "" : "s"}`);
          if (removed.length) parts.push(`${removed.length} set${removed.length === 1 ? "" : "s"} uit roulatie`);
          state.changeSummary = parts.length ? `Nieuw sinds je vorige bezoek: ${parts.join(" en ")}.` : "";
        }
        localStorage.setItem("mtg-legality-last-live-codes", JSON.stringify(nextLegality));
      } catch { /* Vergelijken is optioneel. */ }
      updateHomeNotices();
    }

    async function discoverLiveLegality(sets) {
      const currentYear = Number(todayIso().slice(0, 4));
      const candidates = sets.filter(set => {
        const releaseYear = Number(set.released_at?.slice(0, 4));
        const supportedType = isMainSet(set) || set.set_type === "alchemy";
        return validCurrentSet(set) && supportedType && releaseYear >= currentYear - 4;
      });
      const legality = { standard: [], alchemy: [] };
      const failedCodes = [];
      let successes = 0;

      for (const set of candidates) {
        try {
          const cards = await fetchAllCardsForSet(set.code);

          ["standard", "alchemy"].forEach(key => {
            const legalCards = cards.filter(card => card.legalities?.[key] === "legal").length;
            const required = Math.max(3, Math.ceil(cards.length * .55));
            if (legalCards >= required) legality[key].push(set.code);
          });
          successes += 1;
        } catch {
          failedCodes.push(set.code);
        }
      }

      ["standard","alchemy"].forEach(key => {
        failedCodes.filter(code => state.legality[key].includes(code)).forEach(code => legality[key].push(code));
        legality[key] = Array.from(new Set(legality[key]));
      });
      return { ok: successes > 0, partial: failedCodes.length > 0, legality, failedCodes };
    }

    async function refreshSetData(force = false) {
      const cached = readCache(true);
      if (cached) {
        state.sets = uniqueByCode([...FALLBACK_SETS, ...cached.data]);
        state.legality = cached.legality;
        state.apiFailed = false;
        state.liveStatus = cached.isFresh && !force ? "cache" : "stale";
        state.lastSync = cached.savedAt;
        state.staleCache = cached;
        setUpdatedLabel();
        if (state.selectedFormat) renderDetail(state.selectedFormat);
        if (cached.isFresh && !force) return;
      }

      if (!cached) state.liveStatus = "loading";
      state.apiFailed = false;
      setUpdatedLabel();
      try {
        const payload = await fetchJsonWithRetry(SITE_CONFIG.setsEndpoint, 1);
        if (!payload || !Array.isArray(payload.data)) throw new Error("Ongeldige respons");
        const clean = payload.data.map(set => ({
          code: String(set.code || "").toLowerCase(),
          name: set.name,
          released_at: set.released_at,
          icon_svg_uri: set.icon_svg_uri,
          set_type: set.set_type,
          digital: Boolean(set.digital),
          card_count: Number(set.card_count || 0)
        })).filter(set => set.code && set.name && set.released_at);
        state.sets = uniqueByCode([...FALLBACK_SETS, ...clean]);
        if (state.selectedFormat) renderDetail(state.selectedFormat);

        const discovery = await discoverLiveLegality(clean);
        if (!discovery.ok) throw new Error("Legaliteitscontrole mislukt");
        state.legality = discovery.legality;
        state.apiFailed = discovery.partial;
        state.liveStatus = "live";
        if (!discovery.partial) {
          state.lastSync = writeCache(clean, discovery.legality);
          detectLegalChanges(discovery.legality);
        } else {
          state.lastSync = Date.now();
          elements.apiAlertText.textContent = `${discovery.failedCodes.length} setcontroles konden niet worden afgerond. Voor die sets is de laatst bekende legaliteit behouden.`;
        }
      } catch {
        state.apiFailed = true;
        state.liveStatus = cached ? "stale" : "fallback";
        elements.apiAlertText.textContent = cached
          ? "Scryfall is momenteel niet volledig bereikbaar. De laatst succesvol opgeslagen gegevens blijven zichtbaar."
          : "De live legaliteitscontrole kon niet worden afgerond. De ingebouwde, offline gegevens blijven zichtbaar.";
      }

      setUpdatedLabel();
      if (state.selectedFormat) renderDetail(state.selectedFormat);
    }

    function handleHash() {
      const slug = location.hash.replace(/^#/, "").toLowerCase();
      if (FORMAT_DATA[slug]) openFormat(slug, false);
      else showHome(false);
    }

    document.addEventListener("click", event => {
      const cardSuggestion = event.target.closest("[data-card-suggestion]");
      if (cardSuggestion) {
        chooseCardSuggestion(cardSuggestion.dataset.cardSuggestion);
        return;
      }

      if (!event.target.closest(".card-query-wrap")) closeCardSuggestions();

      const faceToggle = event.target.closest("[data-card-face-toggle]");
      if (faceToggle) {
        const preview = faceToggle.closest(".card-preview");
        const faces = Array.from(preview?.querySelectorAll("[data-card-face]") || []);
        const activeIndex = faces.findIndex(face => !face.hidden);
        const nextIndex = (activeIndex + 1) % faces.length;
        faces.forEach((face, index) => { face.hidden = index !== nextIndex; });
        const showingBack = nextIndex > 0;
        faceToggle.textContent = showingBack ? "↺ Toon voorkant" : "↻ Toon achterkant";
        faceToggle.setAttribute("aria-label", showingBack ? "Toon de voorkant van de kaart" : "Toon de achterkant van de kaart");
        return;
      }

      const favoriteButton = event.target.closest("[data-favorite]");
      if (favoriteButton) {
        setFavorite(favoriteButton.dataset.favorite);
        return;
      }

      const resumeButton = event.target.closest("[data-resume]");
      if (resumeButton) {
        openFormat(resumeButton.dataset.resume);
        return;
      }

      const formatButton = event.target.closest("[data-format]");
      if (formatButton) {
        event.preventDefault();
        openFormat(formatButton.dataset.format);
      }

      const filterButton = event.target.closest("[data-filter]");
      if (filterButton) setHomeFilter(filterButton.dataset.filter);

      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        state.view = viewButton.dataset.view;
        safeStorageSet("mtg-legality-view", state.view);
        document.querySelectorAll(".view-btn").forEach(button => button.setAttribute("aria-pressed", String(button === viewButton)));
        renderSetList();
      }
    });

    elements.cardFinder.addEventListener("submit", event => {
      event.preventDefault();
      searchCard(elements.cardQuery.value);
    });
    elements.cardQuery.addEventListener("input", event => {
      clearTimeout(cardAutocompleteTimer);
      state.autocompleteController?.abort();
      state.autocompleteController = null;
      const requestId = ++state.autocompleteRequest;
      const query = event.target.value.trim();
      state.cardSuggestions = [];
      state.activeSuggestion = -1;

      if (query.length < SITE_CONFIG.autocompleteMinChars) {
        elements.cardSuggestions.hidden = true;
        elements.cardSuggestions.innerHTML = "";
        elements.cardQuery.setAttribute("aria-expanded", "false");
        elements.cardQuery.removeAttribute("aria-activedescendant");
        return;
      }

      renderCardSuggestions("Kaartnamen zoeken…");
      cardAutocompleteTimer = setTimeout(() => loadCardSuggestions(query, requestId), SITE_CONFIG.autocompleteDelayMs);
    });
    elements.cardQuery.addEventListener("keydown", event => {
      if (event.key === "ArrowDown" && state.cardSuggestions.length) {
        event.preventDefault();
        setActiveCardSuggestion(state.activeSuggestion + 1);
      } else if (event.key === "ArrowUp" && state.cardSuggestions.length) {
        event.preventDefault();
        setActiveCardSuggestion(state.activeSuggestion <= 0 ? state.cardSuggestions.length - 1 : state.activeSuggestion - 1);
      } else if (event.key === "Enter" && state.activeSuggestion >= 0) {
        event.preventDefault();
        chooseCardSuggestion(state.cardSuggestions[state.activeSuggestion]);
      } else if (event.key === "Escape" || event.key === "Tab") {
        closeCardSuggestions();
      }
    });
    elements.cardQuery.addEventListener("focus", () => {
      if (elements.cardQuery.value.trim().length >= SITE_CONFIG.autocompleteMinChars && state.cardSuggestions.length) renderCardSuggestions();
    });
    elements.deckForm.addEventListener("submit", event => {
      event.preventDefault();
      checkDeck();
    });
    elements.deckList.addEventListener("input", () => {
      state.deckCheckController?.abort();
      updateDeckCount();
      if (!elements.deckResult.hidden) elements.deckResult.hidden = true;
    });
    elements.deckFormat.addEventListener("change", () => {
      state.deckCheckController?.abort();
      if (!elements.deckResult.hidden) elements.deckResult.hidden = true;
    });
    elements.deckFile.addEventListener("change", async event => {
      try {
        await loadDeckFile(event.target.files?.[0]);
      } catch (error) {
        elements.deckResult.hidden = false;
        elements.deckResult.innerHTML = `<p class="card-result-error"><strong>Bestand niet geladen.</strong><br>${escapeHtml(error.message || "Gebruik een tekstbestand met een decklijst.")}</p>`;
      } finally {
        event.target.value = "";
      }
    });
    document.getElementById("backButton").addEventListener("click", () => showHome());
    document.getElementById("brandButton").addEventListener("click", () => showHome());
    document.getElementById("copyButton").addEventListener("click", copyCurrentLink);
    document.getElementById("retryButton").addEventListener("click", () => refreshSetData(true));
    elements.favoriteDetail.addEventListener("click", () => state.selectedFormat && setFavorite(state.selectedFormat));
    elements.loadMoreButton.addEventListener("click", () => { state.visibleLimit += state.pageSize; renderSetList(); });
    elements.reverseButton.addEventListener("click", () => { state.ascending = !state.ascending; state.visibleLimit = state.pageSize; renderSetList(); });
    elements.setSearch.addEventListener("input", event => { state.query = event.target.value; state.visibleLimit = state.pageSize; renderSetList(); });
    window.addEventListener("popstate", handleHash);
    window.addEventListener("hashchange", handleHash);
    document.addEventListener("visibilitychange", () => {
      const cacheAge = Date.now() - (state.lastSync || 0);
      if (document.visibilityState === "visible" && cacheAge > SITE_CONFIG.cacheHours * 60 * 60 * 1000) refreshSetData(true);
    });

    setUpdatedLabel();
    populateDeckFormats();
    updateDeckCount();
    renderFormats();
    handleHash();
    refreshSetData();
  </script>
</body>
</html>
